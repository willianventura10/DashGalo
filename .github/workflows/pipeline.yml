name: Pipeline

on:
  push:
  schedule:
    - cron: '17 9 * * 1' # segunda, 06:17 (Brasília)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Coletar fichas do blog
        run: npm run coletar
      - name: Commitar dados brutos (se mudaram)
        run: |
          git add dados-brutos
          if git diff --cached --quiet; then echo "Sem mudanças nas fichas."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dados: atualiza fichas do blog"
          git push origin HEAD:${{ github.ref_name }}
      - name: Gerar JSON do dashboard
        run: npm run gerar
      - run: npm run build
      - name: Testes visuais (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Screenshots para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: screenshots, if-no-files-found: ignore }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
